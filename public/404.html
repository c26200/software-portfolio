<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080808" />
    <title>Página no encontrada — Carlos Gordillo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080808;
        color: #f2efe6;
        font-family: 'Instrument Serif', Georgia, serif;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      main { text-align: center; padding: 24px; }
      p {
        margin: 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #c8ff2e;
      }
      h1 { font-weight: 400; font-size: clamp(36px, 8vw, 72px); line-height: 1; margin: 10px 0 28px; }
      a {
        color: #f2efe6;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 12px;
        text-decoration: none;
        border-bottom: 1px solid #f2efe6;
        padding-bottom: 3px;
      }
      a:hover { color: #c8ff2e; border-color: #c8ff2e; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Página no encontrada</h1>
      <a href="/">Volver al portafolio</a>
      <a href="/blog">Ir al blog</a>
    </main>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path !== '/en' && path.indexOf('/en/') !== 0) return;
        document.documentElement.lang = 'en';
        document.title = 'Page not found — Carlos Gordillo';
        var h1 = document.querySelector('h1');
        var links = document.querySelectorAll('a');
        if (h1) h1.textContent = 'Page not found';
        if (links[0]) links[0].textContent = 'Back to the portfolio';
        if (links[1]) links[1].textContent = 'Go to the blog';
      })();
    </script>
  </body>
</html>
